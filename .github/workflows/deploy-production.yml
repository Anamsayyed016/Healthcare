name: Deploy PharmEFC to Production (Zero-Downtime)

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded deploys — only the latest push should run.
concurrency:
  group: pharmefc-production-deploy
  cancel-in-progress: true

env:
  HOST: ${{ secrets.HOST }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PORT: ${{ secrets.SSH_PORT }}
  SSH_KEY: ${{ secrets.SSH_KEY }}
  SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
  PROD_URL: https://aioss.tech
  DEPLOY_FOLDER: /var/www/pharmefc-healthcare
  STAGING_FOLDER: /var/www/pharmefc-healthcare/staging
  BACKUP_FOLDER: /var/www/pharmefc-healthcare/backups
  RELEASES_FOLDER: /var/www/pharmefc-healthcare/releases
  REPO_DIR: /var/www/pharmefc-healthcare/source
  SSH_OPTS_BASE: >-
    -o StrictHostKeyChecking=accept-new
    -o ConnectTimeout=15
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=120
    -o IdentitiesOnly=yes
    -o BatchMode=yes

jobs:
  deploy:
    name: "VPS build & zero-downtime deploy"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment secrets
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          set +e
          MISSING=0
          [ -z "$HOST" ] && echo "HOST: MISSING" && MISSING=1 || echo "HOST: SET"
          [ -z "$SSH_USER" ] && echo "SSH_USER: MISSING" && MISSING=1 || echo "SSH_USER: SET"
          [ -z "$SSH_PORT" ] && echo "SSH_PORT: MISSING" && MISSING=1 || echo "SSH_PORT: SET"

          if [ -z "$SSH_KEY_B64" ] && [ -z "$SSH_KEY" ]; then
            echo "SSH_KEY_B64: MISSING"
            MISSING=1
          elif [ -n "$SSH_KEY_B64" ]; then
            TMP_KEY="$(mktemp)"
            printf '%s' "$SSH_KEY_B64" | tr -d ' \t\r\n' | base64 --decode > "$TMP_KEY"
            chmod 600 "$TMP_KEY"
            ssh-keygen -y -f "$TMP_KEY" > /dev/null 2>&1 || MISSING=1
            rm -f "$TMP_KEY"
            echo "SSH_KEY_B64: valid"
          else
            TMP_KEY="$(mktemp)"
            printf '%s' "$SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$TMP_KEY"
            chmod 600 "$TMP_KEY"
            ssh-keygen -y -f "$TMP_KEY" > /dev/null 2>&1 || MISSING=1
            rm -f "$TMP_KEY"
            echo "SSH_KEY: valid"
          fi

          [ "$MISSING" -eq 1 ] && exit 1
          echo "All secrets validated."

      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            scripts
            ecosystem.config.cjs
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_B64: ${{ secrets.SSH_KEY_B64 }}
        run: |
          chmod +x .github/scripts/setup-deploy-ssh.sh
          .github/scripts/setup-deploy-ssh.sh "$HOME/.ssh/deploy_key"

      - name: Upload deploy scripts to VPS
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT $SSH_OPTS_BASE"
          ssh $SSH_OPTS "$SSH_USER@$HOST" \
            "mkdir -p ${DEPLOY_FOLDER}/shared ${DEPLOY_FOLDER}/logs $STAGING_FOLDER $RELEASES_FOLDER $BACKUP_FOLDER $REPO_DIR"
          scp -i "$HOME/.ssh/deploy_key" -P "$SSH_PORT" $SSH_OPTS_BASE \
            scripts/deploy-pharmefc-zero-downtime.sh \
            scripts/vps-build-and-deploy.sh \
            scripts/prepare-deploy-bundle.sh \
            ecosystem.config.cjs \
            "$SSH_USER@$HOST:${DEPLOY_FOLDER}/shared/"
          ssh $SSH_OPTS "$SSH_USER@$HOST" \
            "chmod +x ${DEPLOY_FOLDER}/shared/*.sh"
          echo "✅ Deploy scripts uploaded"

      - name: Build on VPS and run zero-downtime deploy
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT $SSH_OPTS_BASE"
          echo "🚀 Building on VPS (avoids GitHub runner queue for compile step)..."
          ssh $SSH_OPTS "$SSH_USER@$HOST" \
            "REPO_DIR='$REPO_DIR' \
             STAGING_FOLDER='$STAGING_FOLDER' \
             RELEASES_FOLDER='$RELEASES_FOLDER' \
             BACKUP_FOLDER='$BACKUP_FOLDER' \
             DEPLOY_FOLDER='$DEPLOY_FOLDER' \
             bash ${DEPLOY_FOLDER}/shared/vps-build-and-deploy.sh"

      - name: Verify live site
        env:
          HOST: ${{ secrets.HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p $SSH_PORT $SSH_OPTS_BASE"
          ssh $SSH_OPTS "$SSH_USER@$HOST" "curl -fsSI -H 'Host: aioss.tech' http://127.0.0.1 | head -5"
          ssh $SSH_OPTS "$SSH_USER@$HOST" "pm2 list | grep -E 'pharmefc|naukrimili' || pm2 list"
